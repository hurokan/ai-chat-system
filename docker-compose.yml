services:

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - F:/ai-data/ollama:/root/.ollama
    restart: always

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8000:8000"
    depends_on:
      - ollama
      - postgres
      - redis
      - litellm
    environment:
      OLLAMA_URL: http://ollama:11434
      LITELLM_URL: http://litellm:4000
    restart: always

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: ai_chat
    ports:
      - "5432:5432"
    volumes:
      - F:/ai-data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - F:/ai-data/redis:/data
    restart: always

  litellm:
    image: ghcr.io/berriai/litellm
    container_name: litellm
    ports:
      - "4000:4000"
    volumes:
      - ./infra/litellm-config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml"]
    depends_on:
      - ollama
    restart: always